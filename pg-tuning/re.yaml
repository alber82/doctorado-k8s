#!/bin/bash

NAMESPACE="pg"

# Obtener password
PGPASSWORD=$(kubectl get secret pg-cluster-superuser -n $NAMESPACE -o jsonpath='{.data.password}' | base64 -d)

echo "🗑️  Limpiando..."
kubectl delete deployment postgres-exporter -n $NAMESPACE 2>/dev/null || true
kubectl delete service postgres-exporter -n $NAMESPACE 2>/dev/null || true
kubectl delete servicemonitor postgres-exporter -n $NAMESPACE 2>/dev/null || true
kubectl delete configmap postgres-exporter-queries -n $NAMESPACE 2>/dev/null || true
kubectl delete secret postgres-exporter-secret -n $NAMESPACE 2>/dev/null || true

sleep 3

# Crear secret
kubectl create secret generic postgres-exporter-secret \
  --from-literal=DATA_SOURCE_NAME="postgresql://postgres:${PGPASSWORD}@pg-cluster-rw:5432/postgres?sslmode=disable" \
  --namespace=$NAMESPACE

echo "📝 Desplegando exporter sin stat_statements..."

kubectl apply -f - <<EOF
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: $NAMESPACE
  labels:
    app: postgres-exporter
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: exporter
        image: quay.io/prometheuscommunity/postgres-exporter:v0.18.1
        args:
          - --log.level=info
          - --web.listen-address=:9187
          - --web.telemetry-path=/metrics
          - --no-collector.stat_statements
        env:
        - name: DATA_SOURCE_NAME
          valueFrom:
            secretKeyRef:
              name: postgres-exporter-secret
              key: DATA_SOURCE_NAME
        ports:
        - name: metrics
          containerPort: 9187
        livenessProbe:
          httpGet:
            path: /
            port: 9187
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /
            port: 9187
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 65534
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: $NAMESPACE
  labels:
    app: postgres-exporter
spec:
  ports:
  - name: metrics
    port: 9187
    targetPort: 9187
  selector:
    app: postgres-exporter
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: $NAMESPACE
  labels:
    release: prometheus
    app: postgres-exporter
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
  - port: metrics
    interval: 30s
    path: /metrics
EOF

echo ""
echo "✅ Exporter desplegado"
echo ""
echo "Verificar:"
echo "  kubectl get pods -n $NAMESPACE -l app=postgres-exporter"
echo "  kubectl logs -n $NAMESPACE -l app=postgres-exporter"
echo ""
echo "Probar métricas en ~30 segundos:"
echo "  kubectl port-forward -n $NAMESPACE svc/postgres-exporter 9187:9187"
echo "  curl localhost:9187/metrics | head -50"
