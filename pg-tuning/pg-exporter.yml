cat <<EOF | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-exporter-queries
  namespace: pg
data:
  queries.yaml: |
    pg_stat_statements:
      query: |
        SELECT 
          queryid,
          query,
          calls,
          total_exec_time,
          mean_exec_time,
          stddev_exec_time,
          rows
        FROM pg_stat_statements
        WHERE query NOT LIKE '%pg_stat_statements%'
        ORDER BY total_exec_time DESC
        LIMIT 50
      metrics:
        - queryid:
            usage: "LABEL"
            description: "Query ID"
        - query:
            usage: "LABEL"
            description: "Query text"
        - calls:
            usage: "COUNTER"
            description: "Number of times executed"
        - total_exec_time:
            usage: "COUNTER"
            description: "Total time spent"
        - mean_exec_time:
            usage: "GAUGE"
            description: "Mean execution time"
    
    pg_database_size:
      query: |
        SELECT 
          datname,
          pg_database_size(datname) as size_bytes
        FROM pg_database
      metrics:
        - datname:
            usage: "LABEL"
            description: "Database name"
        - size_bytes:
            usage: "GAUGE"
            description: "Database size in bytes"
    
    pg_cache_hit_ratio:
      query: |
        SELECT 
          sum(heap_blks_read) as heap_read,
          sum(heap_blks_hit) as heap_hit,
          sum(heap_blks_hit) / NULLIF(sum(heap_blks_hit) + sum(heap_blks_read), 0) as ratio
        FROM pg_statio_user_tables
      metrics:
        - ratio:
            usage: "GAUGE"
            description: "Cache hit ratio"
EOF

# Deploy exporter
cat <<EOF | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres-exporter
  namespace: pg  
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres-exporter
  template:
    metadata:
      labels:
        app: postgres-exporter
    spec:
      containers:
      - name: exporter
        image: quay.io/prometheuscommunity/postgres-exporter:latest
        env:
        - name: DATA_SOURCE_NAME
          value: "postgresql://app:$(PGPASSWORD)@pg-cluster-rw:5432/app?sslmode=disable"
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: pg-cluster-app
              key: password
        - name: PG_EXPORTER_EXTEND_QUERY_PATH
          value: "/etc/queries.yaml"
        ports:
        - containerPort: 9187
        volumeMounts:
        - name: queries
          mountPath: /etc/queries.yaml
          subPath: queries.yaml
      volumes:
      - name: queries
        configMap:
          name: postgres-exporter-queries
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-exporter
  namespace: pg  
  labels:
    app: postgres-exporter
spec:
  ports:
  - port: 9187
    targetPort: 9187
  selector:
    app: postgres-exporter
EOF

# Configurar Prometheus para scrapearlo
cat <<EOF | kubectl apply -f -
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: postgres-exporter
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: postgres-exporter
  endpoints:
  - port: metrics
    interval: 30s
EOF
